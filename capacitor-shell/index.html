<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101310" />
    <title>FSM felt</title>
    <style>
      :root {
        color-scheme: dark;
        background: #101310;
        color: #f2efe6;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        padding-bottom: calc(2rem + env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
        color: #c9c6bc;
      }
      code {
        color: #d8ff3e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FSM felt</h1>
      <p>
        Det native skallet er bygget uten en serveradresse. Kjør
        <code>CAPACITOR_SERVER_URL=https://… npm run native:sync</code> og bygg
        appen på nytt.
      </p>
      <p>Den installerte PWA-en virker fortsatt i nettleseren.</p>
    </main>
  </body>
</html>
