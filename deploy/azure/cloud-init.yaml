#cloud-config
# Minimal cloud-init for Ubuntu 24.04 LTS på Azure.
#
# Installerer Docker, Azure CLI, age og PostgreSQL-klient, lager kataloger og
# slår på 2 GB swap. Applikasjonsfilene og systemd-enhetene legges på plass
# etter at repoet er klonet; se deploy/azure/README.md.
#
# Bruk:
#   az vm create ... --custom-data deploy/azure/cloud-init.yaml
#
# Cloud-init kjører én gang. Senere endringer må gjøres manuelt, eller du må
# lage en ny VM.

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - lsb-release
  - unzip
  - age
  - postgresql-client
  - unattended-upgrades

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true
      }

  - path: /etc/sysctl.d/99-fsm.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness = 10
      net.core.somaxconn = 1024

  - path: /etc/systemd/journald.conf.d/99-fsm.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Journal]
      SystemMaxUse=1G
      SystemMaxFileSize=100M

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

runcmd:
  # Docker fra offisielt apt-repo (ikke get.docker.com-skriptet).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  # Azure CLI fra Microsofts apt-repo.
  - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
  - chmod a+r /etc/apt/keyrings/microsoft.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $(lsb_release -cs) main" > /etc/apt/sources.list.d/azure-cli.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin azure-cli
  - systemctl enable --now docker
  - systemctl enable --now unattended-upgrades
  # Kataloger for app, konfigurasjon og backup. /etc/fsm er bare lesbar for root.
  - |
    if id azureuser >/dev/null 2>&1; then
      install -d -m 0755 -o azureuser -g azureuser /opt/fsm-platform
    else
      install -d -m 0755 /opt/fsm-platform
    fi
  - install -d -m 0700 -o root -g root /etc/fsm
  - install -d -m 0700 -o root -g root /var/backups/fsm
  # 2 GB swap gir margin ved PDF/OCR-topper og image-oppdateringer.
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  - sysctl --system
  - docker --version
  - docker compose version
  - az version

final_message: "FSM Azure-vert er klar. Klon repoet til /opt/fsm-platform og følg deploy/azure/README.md."
