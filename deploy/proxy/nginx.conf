# Eksempel på nginx foran FSM-plattformen. Legg den i
# /etc/nginx/sites-available/fsm.example.com og lenk til sites-enabled.
#
# Viktig:
#   * X-Forwarded-For settes til $remote_addr, ikke $proxy_add_x_forwarded_for.
#     Da kan ikke klienten sende med sin egen liste.
#   * client_max_body_size 55m dekker 50 MB PDF pluss multipart-overhead.
#   * Kundeimport har en egen grense: 520m, fordi appen tar imot ZIP opp til
#     512 MiB (proxyClientMaxBodySize i next.config.ts). Se location-blokken.
#   * proxy_read_timeout/send_timeout er lange nok for PDF og OCR.
#   * Proxyinnstillingene står på server-nivå, slik at begge location-blokkene
#     nedenfor arver dem og bare body-grensen må gjentas.
#
# I .env:
#   TRUST_PROXY=true
#   TRUST_PROXY_HOPS=1
#
# Ved flere proxyer: øk TRUST_PROXY_HOPS og sørg for at bare kantsonen
# overskriver X-Forwarded-For. Se deploy/proxy/README.md.

upstream fsm_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fsm.example.com;

    # La Certbot/ACME utfordre over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fsm.example.com;

    ssl_certificate     /etc/letsencrypt/live/fsm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fsm.example.com/privkey.pem;

    client_max_body_size 55m;
    client_body_timeout 60s;

    # Ikke annonser nginx-versjonen.
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Overskriv, ikke append. Dette er sikkerhetsgrensen for IP-rate limits.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    # PDF/OCR og store opplastinger kan ta tid.
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Appen setter selv cache- og sikkerhetsheadere der det er relevant.
    proxy_buffering on;
    proxy_request_buffering on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Kundeimport tar imot en ZIP på opptil 500 MiB, og appen håndhever selv
    # grensen på 512 MiB for hele forespørselsbodyen (proxyClientMaxBodySize i
    # next.config.ts). Den globale 55m-grensen ville gitt 413 i proxyen før
    # appen fikk svart, så en stor men gyldig import ville feilet med en
    # generisk nginx-side i stedet for appens forklarende feil.
    #
    # 520m = 512 MiB + 8 MiB slakk, slik at multipart-overhead ikke spiser av
    # appens grense og appen fortsatt er den som avviser for store pakker.
    # Prefikset har ingen avsluttende skråstrek fordi både
    # POST /api/innstillinger/kunder/import og .../import/<jobb> skal treffe.
    location ^~ /api/innstillinger/kunder/import {
        client_max_body_size 520m;
        proxy_pass http://fsm_app;
    }

    location / {
        proxy_pass http://fsm_app;
    }
}
