name: CI

on:
  push:
    branches: [master, main, dev]
    tags: ["v*"]
  pull_request:

# CI trenger bare å lese repoet. Ingen jobb skal kunne skrive til repoet eller
# publisere pakker; det gjøres av den separate publiseringsworkflowen.
permissions:
  contents: read

# Avbryt tidligere kjøringer for samme gren når nye commits kommer inn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typesjekk, lint og bygg
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: fsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Testverdier – brukes bare mot tjenestecontaineren over.
      DATABASE_URL: postgresql://admin:admin@localhost:5432/fsm_test?schema=public
      TEST_DATABASE_URL: postgresql://admin:admin@localhost:5432/fsm_test?schema=public
      # Faste, fiktive demokontoer fra scripts/seed-e2e.mjs.
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: "AdminTest123!"
      E2E_OFFICE_EMAIL: kontor@example.test
      E2E_OFFICE_PASSWORD: "OfficeTest123!"
      E2E_TECHNICIAN_EMAIL: montor@example.test
      E2E_TECHNICIAN_PASSWORD: "TechTest123!"
      E2E_CUSTOMER_EMAIL: kunde@example.test
      E2E_CUSTOMER_PASSWORD: "CustomerTest123!"
      NEXTAUTH_SECRET: ci-only-8fK2qZ7mN4vR9xT1cB6wY3pL5sH0jG2d
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Sikkerhetsrevisjon av avhengigheter
        run: npm audit --omit=dev

      - name: Bruk migrasjonene på en tom database
        run: npx prisma migrate deploy

      - name: Sjekk at migrasjonene gir samme skjema som schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Generer rutetyper
        run: npx next typegen

      - name: Typesjekk
        run: npx tsc --noEmit

      - name: Test med dekningskrav
        run: npm run test:coverage

      - name: Integrasjonstester
        run: npm run test:integration

      - name: Seed E2E-brukere og demodata
        run: node scripts/seed-e2e.mjs

      - name: Installer Playwright-nettleser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Lint
        run: npm run lint

      - name: i18n-sjekk
        run: npm run check:i18n:strict

      - name: Bygg
        run: npm run build

  a11y:
    name: Tilgjengelighet (axe og Lighthouse)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: fsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Samme testoppsett som E2E-jobben, men appen kjøres i produksjonsmodus
      # slik at Lighthouse får samme ytelse som i drift. NEXTAUTH_URL holder
      # sesjonscookien usikret over http://127.0.0.1 i CI.
      DATABASE_URL: postgresql://admin:admin@localhost:5432/fsm_test?schema=public
      # Faste, fiktive demokontoer fra scripts/seed-e2e.mjs. Lighthouse bruker
      # admin-kontoen og må matche den seedede administratoren.
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: "AdminTest123!"
      E2E_OFFICE_EMAIL: kontor@example.test
      E2E_OFFICE_PASSWORD: "OfficeTest123!"
      E2E_TECHNICIAN_EMAIL: montor@example.test
      E2E_TECHNICIAN_PASSWORD: "TechTest123!"
      E2E_CUSTOMER_EMAIL: kunde@example.test
      E2E_CUSTOMER_PASSWORD: "CustomerTest123!"
      NEXTAUTH_SECRET: ci-only-8fK2qZ7mN4vR9xT1cB6wY3pL5sH0jG2d
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Bruk migrasjonene på en tom database
        run: npx prisma migrate deploy

      - name: Seed E2E-brukere og demodata
        run: node scripts/seed-e2e.mjs

      - name: Bygg appen
        run: npm run build

      - name: Installer Playwright-nettleser for innlogging
        run: npx playwright install --with-deps chromium

      - name: Lighthouse-tilgjengelighet
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/ready > /dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3000/api/ready > /dev/null; then
            cat /tmp/next-start.log
            exit 1
          fi
          npm run test:lighthouse
        env:
          LIGHTHOUSE_URLS: http://127.0.0.1:3000/logg-inn,http://127.0.0.1:3000/oppdrag,http://127.0.0.1:3000/mine-oppdrag
          LIGHTHOUSE_AUTH_EMAIL: admin@example.test
          LIGHTHOUSE_AUTH_PASSWORD: "AdminTest123!"
          LIGHTHOUSE_A11Y_THRESHOLD: "0.95"

  docker:
    name: Docker-bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Bygg imaget
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: fsm-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verifiser Prisma schema-engine i imaget
        run: |
          docker run --rm --entrypoint sh fsm-platform:ci -lc '
            test -n "$(find node_modules/@prisma/engines -maxdepth 1 -name "schema-engine-*" -print -quit)" &&
            node node_modules/prisma/build/index.js -v
          '

      - name: Skann imaget for sårbarheter
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fsm-platform:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
