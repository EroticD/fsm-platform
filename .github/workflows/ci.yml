name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Avbryt tidligere kjøringer for samme gren når nye commits kommer inn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typesjekk, lint og bygg
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: fsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Testverdier – brukes bare mot tjenestecontaineren over.
      DATABASE_URL: postgresql://admin:admin@localhost:5432/fsm_test?schema=public
      NEXTAUTH_SECRET: ci-secret-brukes-bare-i-test
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Bruk migrasjonene på en tom database
        run: npx prisma migrate deploy

      - name: Sjekk at migrasjonene gir samme skjema som schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Generer rutetyper
        run: npx next typegen

      - name: Typesjekk
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Bygg
        run: npm run build

  docker:
    name: Docker-bygg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Bygg imaget
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
