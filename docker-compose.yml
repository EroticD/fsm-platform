# FSM-plattformen – lokal utvikling og selvhosting.
#
# Alle hemmeligheter leses fra .env (se .env.example). Kopier filen og fyll inn
# dine egne verdier før du starter:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Appen svarer da på http://localhost:3000

# Roter Docker-loggen, slik at en disk ikke fylles av json-file-loggeren.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-fsm_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett POSTGRES_PASSWORD i .env}
    logging: *default-logging
    ports:
      # Bindes til localhost slik at databasen ikke eksponeres på nettverket.
      - "127.0.0.1:5432:5432"
    volumes:
      - fsm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-fsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    # Navnet imaget får lokalt ved `docker compose build`.
    image: fsm-platform:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Valgfrie roller: runtime (DML) og migrasjoner (DDL). Uten dem brukes
      # POSTGRES_USER som før. Se «Databaseroller» i docs/OPERATIONS.md.
      DATABASE_URL: ${DATABASE_RUNTIME_URL:-postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fsm_db}?schema=public}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      # NEXTAUTH_URL må være den offentlige adressen i produksjon.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Valgfri offentlig adresse for PDF-er og origin-sjekk.
      APP_URL: ${APP_URL:-}
      TZ: Europe/Oslo
      # AUTH_TRUST_HOST gjør at appen kan kjøre bak en proxy/container uten at
      # NextAuth avviser vertsnavnet.
      AUTH_TRUST_HOST: "true"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Sett NEXTAUTH_SECRET i .env}
      # E-post (valgfritt). Uten SMTP-innstillinger viser appen invitasjonslenker
      # som må deles manuelt.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Opprett en administrator første gang appen starter.
      SEED_DATABASE: ${SEED_DATABASE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      # Innebygd jobb for serviceavtaler. Kan slås av hvis en ekstern cron
      # bruker /api/cron/recurring i stedet.
      RECURRING_SCHEDULER: ${RECURRING_SCHEDULER:-true}
      CRON_SECRET: ${CRON_SECRET:-}
      READY_SECRET: ${READY_SECRET:-}
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
      GEOCODE_USER_AGENT: ${GEOCODE_USER_AGENT:-}
      GEOCODE_TIMEOUT_MS: ${GEOCODE_TIMEOUT_MS:-2500}
      TRACKING_AVERAGE_SPEED_KMH: ${TRACKING_AVERAGE_SPEED_KMH:-50}
    logging: *default-logging
    ports:
      # I produksjon bør dette være "127.0.0.1:3000:3000" når appen står bak en
      # reverse proxy på samme maskin. Da kan ikke appen nås direkte utenom TLS.
      - "3000:3000"
    volumes:
      # Opplastede bilder og vedlegg ligger utenfor containeren.
      - fsm_uploads:/app/uploads

volumes:
  fsm_postgres_data:
  fsm_uploads:
