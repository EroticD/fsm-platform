# Produksjon med ferdig image fra GitHub Container Registry.
# Bruk dette i stedet for docker-compose.yml når du ikke vil bygge på dropleten:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# APP_IMAGE er påkrevd og skal peke på en publisert versjon eller et digest –
# ikke `latest`. Se docs/OPERATIONS.md («Produksjonssett: image-pinning»).
#
# Maskinen bør ha minst 1 GB RAM og 2 GB swap. Minnegrensene under er dimensjonert
# for en 1 GB Droplet; se «Minne og swap» i docs/OPERATIONS.md før du justerer.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Pinn til en konkret 15.x-minor (eller digest) i produksjon. Standard er
    # 15.13, ikke den rullende 15-taggen. Vil du låse helt, bruk digest:
    # POSTGRES_IMAGE=postgres:15.13@sha256:<digest>. Se docs/OPERATIONS.md.
    image: ${POSTGRES_IMAGE:-postgres:15.13}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-fsm_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sett POSTGRES_PASSWORD i .env}
    # Holder Postgres innenfor 1 GB-dropleten. Verdiene er bevisst små og kan
    # økes hvis maskinen har mer RAM.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=50
    mem_limit: 300m
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fsm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-fsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?Sett APP_IMAGE til en publisert versjon, f.eks. ghcr.io/eroticd/fsm-platform:v0.7.6}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Runtime kan bruke en DML-rolle og migrasjonene en DDL-rolle. Begge
      # variablene er valgfrie; uten dem brukes POSTGRES_USER som før. Se
      # «Databaseroller» i docs/OPERATIONS.md.
      DATABASE_URL: ${DATABASE_RUNTIME_URL:-postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fsm_db}?schema=public}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Sett NEXTAUTH_URL til https://...}
      APP_URL: ${APP_URL:?Sett APP_URL til https://...}
      TZ: Europe/Oslo
      AUTH_TRUST_HOST: "true"
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Sett NEXTAUTH_SECRET i .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # SMS og toveismeldinger. console er tørrkjøring uten nettverkskall.
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-FSM}
      SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-}
      SMS_ALLOWLIST: ${SMS_ALLOWLIST:-}
      SMS_WORKER: ${SMS_WORKER:-true}
      SMS_LINKMOBILITY_URL: ${SMS_LINKMOBILITY_URL:-}
      SMS_LINKMOBILITY_API_KEY: ${SMS_LINKMOBILITY_API_KEY:-}
      SMS_LINKMOBILITY_SECRET: ${SMS_LINKMOBILITY_SECRET:-}
      SMS_PSWINCOM_URL: ${SMS_PSWINCOM_URL:-}
      SMS_PSWINCOM_USER: ${SMS_PSWINCOM_USER:-}
      SMS_PSWINCOM_PASSWORD: ${SMS_PSWINCOM_PASSWORD:-}
      SMS_PSWINCOM_SECRET: ${SMS_PSWINCOM_SECRET:-}
      SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID:-}
      SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN:-}
      SEED_DATABASE: ${SEED_DATABASE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      RECURRING_SCHEDULER: ${RECURRING_SCHEDULER:-true}
      CRON_SECRET: ${CRON_SECRET:-}
      READY_SECRET: ${READY_SECRET:-}
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
      GEOCODE_USER_AGENT: ${GEOCODE_USER_AGENT:-}
      GEOCODE_TIMEOUT_MS: ${GEOCODE_TIMEOUT_MS:-2500}
      TRACKING_AVERAGE_SPEED_KMH: ${TRACKING_AVERAGE_SPEED_KMH:-50}
      # Valgfri migrasjonssperre. Se docs/OPERATIONS.md.
      REQUIRE_BACKUP_BEFORE_MIGRATE: ${REQUIRE_BACKUP_BEFORE_MIGRATE:-false}
      BACKUP_CONFIRMED: ${BACKUP_CONFIRMED:-false}
      # V8-heapen holdes godt under mem_limit, slik at native buffere (sharp,
      # tesseract, PDF) og tmpfs fortsatt får plass. Worst case (full heap +
      # fulle tmpfs) er 384 + 160 + 96 = 640 MB, og da gjenstår ca. 60 MB til
      # native minne. Juster /tmp, heapen eller mem_limit bevisst ved behov.
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - fsm_uploads:/app/uploads
    # Produksjonsherding. Opplastingsvolumet er skrivbart, mens resten av
    # filsystemet er read-only. /tmp er tmpfs for OCR og Node.
    read_only: true
    tmpfs:
      - /tmp:size=160m,mode=1777
      - /app/.next/cache:size=96m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Dimensjonert for 1 GB Droplet. Postgres bruker 300 MB, appen 700 MB.
    # Sammen med OS/dockerd krever dette swap – se docs/OPERATIONS.md.
    mem_limit: 700m
    mem_reservation: 256m
    logging: *default-logging
    # Readiness, ikke liveness. Imaget har sin egen liveness-healthcheck mot
    # /api/health; Compose overstyrer den med denne. En utilgjengelig database
    # gjør containeren «unhealthy», men restart-policyen restarter den ikke –
    # dermed unngår vi restart-løkke ved DB-utfall.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s

volumes:
  fsm_postgres_data:
  fsm_uploads:
